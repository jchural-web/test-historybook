<div class="modal-overlay">
  <div class="modal-card">
    <!-- Header -->
    <div class="modal-header" [style.background-color]="headerColor">
      <div class="header-left">
        <app-icon-slot
          [iconName]="'phone'"
          [backgroundColor]="'transparent'"
          [iconColor]="'white'"
          [size]="'sm'"
        ></app-icon-slot>
        <span class="header-title">{{ headerTitle }}</span>
      </div>
      <button class="close-button" (click)="onCerrar()" type="button">
        <span [innerHTML]="closeIconSvg" class="close-icon"></span>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <!-- Contact Information Row -->
      <div class="info-row">
        <div class="info-label">CONTACTO</div>
        <div class="contact-name">{{ contactName }}</div>
      </div>

      <!-- Opportunity Information Row -->
      <div class="info-row">
        <div class="info-label">OPORTUNIDAD</div>
        <div class="opportunity-info">
          <div class="opportunity-title">{{ oportunidadTitulo }}</div>
          <div class="metadata-inline">
            <span class="metadata-item" *ngIf="fase">Fase: <span class="metadata-text">{{ fase }}</span></span>
            <span class="metadata-item" *ngIf="categoria">Categoria: <span class="metadata-text categoria-text">{{ categoria }}</span></span>
            <span class="metadata-item" *ngIf="probabilidadActual">Prob. Actual: <span class="metadata-text probability-text">{{ probabilidadActual }}</span></span>
          </div>
        </div>
      </div>

      <!-- Central phone icon with ringing animation -->
      <div class="phone-icon-wrapper">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <app-icon-slot
          [iconName]="'phone'"
          [backgroundColor]="'#DCFCE7'"
          [iconColor]="'#16A34A'"
          [size]="'lg'"
        ></app-icon-slot>
      </div>

      <!-- Description text -->
      <div class="description-text">{{ descripcionLlamada }}</div>

      <!-- Execute button -->
      <div class="button-wrapper">
        <app-boton-maestro
          label="Ejecutar"
          variant="ovalado"
          bgColor="#22C55E"
          textColor="#FFFFFF"
          [iconName]="circlePlayIconSvg"
          [showIcon]="true"
          (clicked)="onEjecutar()"
        ></app-boton-maestro>
      </div>
    </div>
  </div>
</div>
