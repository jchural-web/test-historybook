<div class="modal-container">
  <div class="modal-card">
    <!-- Header -->
    <div class="modal-header" [style.background-color]="headerColor">
      <div class="header-left">
        <app-icon-slot
          [iconName]="'phone'"
          [backgroundColor]="'transparent'"
          [iconColor]="'white'"
          [size]="'sm'"
        ></app-icon-slot>
        <span class="header-title">{{ headerTitle }}</span>
      </div>
      <button class="close-button" (click)="onCerrar()" type="button">
        <span [innerHTML]="closeIconSvg" class="close-icon"></span>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <!-- Contact Information -->
      <div class="info-section">
        <div class="info-label">CONTACTO</div>
        <div class="contact-name">{{ contactName }}</div>
      </div>

      <!-- Opportunity Information -->
      <div class="info-section">
        <div class="info-label">OPORTUNIDAD</div>
        <div class="oportunidad-titulo">{{ oportunidadTitulo }}</div>
        <div class="metadata">
          <div class="metadata-item" *ngIf="fase">
            <span class="metadata-label">Fase:</span>
            <span class="metadata-value">{{ fase }}</span>
          </div>
          <div class="metadata-item" *ngIf="categoria">
            <span class="metadata-label">Categoria:</span>
            <span class="metadata-value">{{ categoria }}</span>
          </div>
          <div class="metadata-item" *ngIf="probabilidadActual">
            <span class="metadata-label">Prob. Actual:</span>
            <span class="metadata-value">{{ probabilidadActual }}</span>
          </div>
        </div>
      </div>

      <!-- Central phone icon with ringing animation -->
      <div class="phone-icon-container">
        <div class="ring-wrapper">
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
          <app-icon-slot
            [iconName]="'phone'"
            [backgroundColor]="'#22C55E'"
            [iconColor]="'white'"
            [size]="'lg'"
          ></app-icon-slot>
        </div>
      </div>

      <!-- Description text -->
      <div class="description-text">{{ descripcionLlamada }}</div>

      <!-- Execute button -->
      <div class="button-container">
        <app-boton-maestro
          label="Ejecutar"
          variant="default"
          bgColor="#22C55E"
          textColor="#FFFFFF"
          [iconName]="phoneCallIconSvg"
          [showIcon]="true"
          (clicked)="onEjecutar()"
        ></app-boton-maestro>
      </div>
    </div>
  </div>
</div>
