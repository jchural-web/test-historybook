<div class="modal-overlay">
  <div class="modal-card">
    <!-- Header -->
    <div class="modal-header" [style.background-color]="headerColor">
      <div class="header-left">
        <span [innerHTML]="phoneIconSvg" class="header-icon"></span>
        <span class="header-title">{{ headerTitle }}</span>
      </div>
      <button class="close-button" (click)="onCerrar()" type="button">
        <span [innerHTML]="closeIconSvg" class="close-icon"></span>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <!-- Contact Information -->
      <div class="contact-info-block">
        <div class="info-label">CONTACTO</div>
        <div class="contact-name">{{ contactName }}</div>
      </div>

      <!-- Opportunity Information -->
      <div class="opportunity-info-block">
        <div class="info-label">OPORTUNIDAD</div>
        <div class="opportunity-title">{{ oportunidadTitulo }}</div>
        <div class="metadata-list">
          <div class="metadata-row" *ngIf="fase">
            <span class="metadata-label">Fase:</span>
            <span class="metadata-value">{{ fase }}</span>
          </div>
          <div class="metadata-row" *ngIf="categoria">
            <span class="metadata-label">Categoria:</span>
            <span class="metadata-value categoria-value">{{ categoria }}</span>
          </div>
          <div class="metadata-row" *ngIf="probabilidadActual">
            <span class="metadata-label">Prob. Actual:</span>
            <span class="metadata-value probability-value">{{ probabilidadActual }}</span>
          </div>
        </div>
      </div>

      <!-- Central phone icon with ringing animation -->
      <div class="phone-icon-wrapper">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="phone-icon-center">
          <span [innerHTML]="phoneCallIconSvg"></span>
        </div>
      </div>

      <!-- Description text -->
      <div class="description-text">{{ descripcionLlamada }}</div>

      <!-- Execute button -->
      <div class="button-wrapper">
        <app-boton-maestro
          label="Ejecutar"
          variant="ovalado"
          bgColor="#22C55E"
          textColor="#FFFFFF"
          [iconName]="circlePlayIconSvg"
          [showIcon]="true"
          (clicked)="onEjecutar()"
        ></app-boton-maestro>
      </div>
    </div>
  </div>
</div>
