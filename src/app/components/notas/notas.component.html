<div
  #notasContainer
  class="notas-container"
  [ngStyle]="containerStyle"
>
  <div class="notas-header" (mousedown)="onHeaderMouseDown($event)">
    <button class="header-move-icon" type="button" [attr.aria-label]="'Arrastrar'">
      <span [innerHTML]="getSanitizedIcon('move')"></span>
    </button>

    <div class="header-content">
      <span class="header-title">{{ title }}</span>
    </div>

    <button
      class="header-minimize-btn"
      (click)="toggleMinimize()"
      type="button"
      [attr.aria-label]="isMinimized ? 'Restaurar' : 'Minimizar'"
    >
      <span [innerHTML]="getSanitizedIcon('minus')"></span>
    </button>
  </div>

  <div *ngIf="!isMinimized" class="notas-body">
    <textarea
      class="notas-textarea"
      [placeholder]="placeholder"
      [value]="content"
      (input)="onContentChange($any($event).target.value)"
      [attr.maxlength]="maxLength"
    ></textarea>

    <div class="notas-counter">{{ content.length }}/{{ maxLength }}</div>
  </div>
</div>
