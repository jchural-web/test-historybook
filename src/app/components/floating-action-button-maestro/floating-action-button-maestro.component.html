<div [class]="fabContainerClass" [ngStyle]="containerStyle">
  <button
    [class]="fabClass"
    (click)="onClick($event)"
    type="button"
    [attr.aria-label]="label"
  >
    <span *ngIf="variant !== 'extendido'" class="fab-icon">
      <span [innerHTML]="getSanitizedIcon()"></span>
    </span>

    <span *ngIf="variant === 'extendido'" class="fab-icon-extended">
      <span [innerHTML]="getSanitizedIcon()"></span>
    </span>

    <span *ngIf="variant === 'extendido' || showLabel" class="fab-label">
      {{ label }}
    </span>

    <!-- Badge for circular-con-badge variant -->
    <div
      *ngIf="variant === 'circular-con-badge' && showBadge && badgeCount > 0"
      class="fab-badge"
    >
      {{ badgeCount }}
    </div>
  </button>
</div>
