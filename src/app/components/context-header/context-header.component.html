<div class="context-header" [ngStyle]="headerStyle">
  <button
    class="header-back-btn"
    (click)="onBackClick()"
    type="button"
    [attr.aria-label]="'Volver'"
  >
    <span class="chevron-icon" [innerHTML]="getSanitizedChevron()"></span>
  </button>

  <span class="header-icon" [innerHTML]="getSanitizedIcon()"></span>

  <span class="header-title">{{ title }}</span>
</div>
