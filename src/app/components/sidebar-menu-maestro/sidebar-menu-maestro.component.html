<div class="sidebar-menu-maestro" [class.sidebar-collapsed]="collapsed">
  <!-- Header -->
  <div class="sidebar-header">
    <svg
      class="sidebar-header-icon"
      width="14"
      height="14"
      viewBox="0 0 15 15"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M6.25 8.12476V12.4998H8.75V8.12476H6.25ZM13.75 11.8748C13.75 12.372 13.5523 12.8494 13.2007 13.201C12.8491 13.5526 12.3722 13.7498 11.875 13.7498H3.125C2.62779 13.7498 2.15093 13.5526 1.79932 13.201C1.44769 12.8494 1.25 12.372 1.25 11.8748V6.24976C1.25 5.97719 1.30924 5.70782 1.42395 5.46057C1.53873 5.21319 1.7064 4.99392 1.91467 4.81787L6.28662 1.07031L6.28967 1.06787C6.6281 0.781848 7.0569 0.624756 7.5 0.624756C7.88766 0.624756 8.26428 0.744967 8.5791 0.966553L8.71033 1.06787L8.71338 1.07031L13.0853 4.81787L13.1616 4.88562C13.3348 5.04894 13.4756 5.24409 13.576 5.46057C13.6908 5.70782 13.75 5.97719 13.75 6.24976V11.8748ZM10 12.4998H11.875C12.0407 12.4998 12.1997 12.4344 12.3169 12.3173C12.4341 12.2001 12.5 12.0405 12.5 11.8748V6.24976C12.5 6.1589 12.4803 6.06911 12.442 5.98669C12.4038 5.90424 12.3479 5.83114 12.2784 5.77246L12.2754 5.76941L7.90344 2.02185V2.02246C7.79063 1.92712 7.6477 1.87476 7.5 1.87476C7.3523 1.87476 7.20937 1.92712 7.09656 2.02246L7.09595 2.02185L2.72461 5.76941L2.72156 5.77246C2.65213 5.83114 2.59624 5.90424 2.55798 5.98669C2.51975 6.06911 2.5 6.1589 2.5 6.24976V11.8748C2.5 12.0405 2.5659 12.2001 2.68311 12.3173C2.8003 12.4344 2.95931 12.4998 3.125 12.4998H5V8.12476C5.00008 7.79334 5.13186 7.47532 5.36621 7.24097C5.60062 7.00664 5.91855 6.87476 6.25 6.87476H8.75C9.08145 6.87476 9.39938 7.00664 9.63379 7.24097C9.86814 7.47532 9.99992 7.79334 10 8.12476V12.4998Z"
        fill="#7B3FF7"
      />
    </svg>
    <span class="sidebar-header-text" *ngIf="!collapsed">{{ headerText }}</span>
  </div>

  <!-- Modules Label -->
  <div class="sidebar-modules-label" *ngIf="!collapsed">MÓDULOS</div>

  <!-- Items Container -->
  <div class="sidebar-items-container">
    <ng-container *ngFor="let item of items">
      <ng-container *ngTemplateOutlet="menuItemTemplate; context: { item: item, level: 0 }"></ng-container>
    </ng-container>
  </div>
</div>

<!-- Menu Item Template (supports nested levels) -->
<ng-template #menuItemTemplate let-item="item" let-level="level">
  <div
    class="sidebar-item"
    [class.sidebar-item-active]="isActive(item.id)"
    [class.sidebar-item-expanded]="isExpanded(item.id)"
    [class.sidebar-item-collapsed]="collapsed"
    [class.sidebar-item-level-2]="level === 1"
    [class.sidebar-item-level-3]="level === 2"
    (click)="onItemClick(item)"
  >
    <div class="sidebar-item-content">
      <span
        class="sidebar-item-icon"
        [innerHTML]="getIconSvg(item.icon)"
      ></span>

      <span class="sidebar-item-label" *ngIf="!collapsed">{{ item.label }}</span>

      <span class="sidebar-item-badge" *ngIf="!collapsed && item.badgeCount">
        {{ item.badgeCount }}
      </span>
    </div>

    <!-- Chevron for expandable items -->
    <svg
      class="sidebar-item-chevron"
      *ngIf="!collapsed && hasChildren(item)"
      width="15"
      height="15"
      viewBox="0 0 15 15"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        [attr.d]="
          isExpanded(item.id)
            ? 'M3.30806 5.18306C3.06398 5.42714 3.06398 5.82277 3.30806 6.06685L7.05806 9.81685C7.30214 10.0609 7.69777 10.0609 7.94185 9.81685L11.6918 6.06685C11.9359 5.82277 11.9359 5.42714 11.6918 5.18306C11.4478 4.93898 11.0521 4.93898 10.8081 5.18306L7.49995 8.49116L4.19185 5.18306C3.94777 4.93898 3.55214 4.93898 3.30806 5.18306Z'
            : 'M5.18306 3.30806C5.42714 3.06398 5.82277 3.06398 6.06685 3.30806L9.81685 7.05806C10.0609 7.30214 10.0609 7.69777 9.81685 7.94185L6.06685 11.6918C5.82277 11.9359 5.42714 11.9359 5.18306 11.6918C4.93898 11.4478 4.93898 11.0521 5.18306 10.8081L8.49116 7.49995L5.18306 4.19185C4.93898 3.94777 4.93898 3.55214 5.18306 3.30806Z'
        "
        fill="currentColor"
      ></path>
    </svg>
  </div>

  <!-- Nested children items (shown when expanded) -->
  <ng-container *ngIf="isExpanded(item.id) && hasChildren(item) && !collapsed">
    <ng-container *ngFor="let child of item.children">
      <ng-container *ngTemplateOutlet="menuItemTemplate; context: { item: child, level: level + 1 }"></ng-container>
    </ng-container>
  </ng-container>
</ng-template>
