<div class="crm-layout">
  <!-- Loading Overlay with Modal -->
  <div class="crm-loading-overlay" *ngIf="isLoading">
    <app-modal-llamada
      [contactName]="'Carlos Mendoza'"
      [oportunidadTitulo]="'LEAN SSSB ONLINE 2024 II LIMA'"
      [fase]="'BNC'"
      [categoria]="'Facebook Chat'"
      [probabilidadActual]="'Alta'"
      [headerTitle]="'Llamada en curso'"
      [headerColor]="'#9333EA'"
      [descripcionLlamada]="'El sistema está realizando una llamada automática a este contacto'"
      (cerrar)="onModalCerrar()"
    ></app-modal-llamada>
  </div>

  <app-header-bar
    [username]="'Yesica Palomino'"
    [appName]="'Integra CRM'"
    [actions]="headerActions"
    (menuClick)="onMenuClick()"
  ></app-header-bar>

  <div class="crm-container" [class.sidebar-expanded]="isSidebarExpanded">
    <aside class="crm-sidebar">
      <app-sidebar-menu-maestro
        [items]="sidebarItems"
        [activeItemId]="activeSidebarId"
        [expandedIds]="expandedSidebarIds"
        [collapsed]="!isSidebarExpanded"
        (itemClick)="onSidebarItemClick($event)"
        (expandedIdsChange)="onExpandedIdsChange($event)"
      ></app-sidebar-menu-maestro>
    </aside>

    <main class="crm-main-content">
      <div class="performance-cards-grid">
        <app-performance-card
          *ngFor="let card of performanceCards"
          [title]="card.title"
          [value]="card.value"
          [percent]="card.percent"
          [icon]="card.icon"
          [iconColor]="card.iconColor"
        ></app-performance-card>
      </div>

      <!-- Navigation Tabs -->
      <div class="navigation-tabs-wrapper">
        <app-tabs-navegacion-maestras
          [tabs]="navigationTabs"
          [activeTabId]="activeTabId"
          (tabChange)="onTabChange($event)"
        ></app-tabs-navegacion-maestras>
      </div>

      <div class="content-header">
        <h1 class="page-title">Contacto Entrante</h1>

        <div class="header-actions">
          <app-search-bar
            [placeholder]="'Buscar contacto...'"
            [value]="searchValue"
            (valueChange)="onSearch($event)"
          ></app-search-bar>
          <app-boton-maestro
            label="Filtrar"
            variant="default"
            (clicked)="onFilter()"
          ></app-boton-maestro>
        </div>
      </div>

      <div class="table-section">
        <app-actividades-table-with-pagination
          [headerColor]="'#E3F2FD'"
          [allRows]="actividadesData"
        ></app-actividades-table-with-pagination>
      </div>
    </main>
  </div>
</div>
